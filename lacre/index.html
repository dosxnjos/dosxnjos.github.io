.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}

  .tabs{display:flex}
  .tabs button{flex:1 1 auto;padding:9px 10px}

/* ================= OS detection ================= */
function detectOS() {
  const ua = navigator.userAgent || '';
  const uad = navigator.userAgentData;
  const p = (uad && typeof uad.platform === 'string' ? uad.platform : '').toLowerCase();

  if (p === 'ios' || /iPhone|iPad|iPod/i.test(ua)) return 'ios';

  if (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) return 'ios';

  if (p === 'macos') return 'mac';
  if (p === 'chrome os' || p === 'chromeos') return 'chromeos';
  if (p === 'linux') return 'linux';
  if (/Windows/.test(ua)) return 'windows';
  if (/Macintosh|Mac OS X/.test(ua)) return 'mac';
  if (/CrOS/.test(ua)) return 'chromeos';

    const a = v && typeof v.architecture === 'string' ? v.architecture.toLowerCase() : '';
    if (a === 'arm' || a === 'x86') { ARCH = a; renderPrimary(); }
  }).catch(() => {});
}

/* ================= primary download ================= */
const DL_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>';

function bigBtn(asset, labelKey, subKey, primary) {
  return '<a class="btn big ' + (primary ? 'primary" id="primaryDl' : 'dl-alt') +
    '" data-asset="' + asset + '" href="' + ASSET[asset] + '">' + DL_ICON +
    '<span class="txt">' + t(labelKey) + '<span class="sub">' + t(subKey) + '</span></span></a>';
}

function renderPrimary() {
  const box = document.getElementById('dl');
  const main = document.getElementById('dlMain');
  const extra = document.getElementById('dlExtra');
  const title = document.getElementById('dlTitle');
  const mobile = document.getElementById('mobile');
  if (isMobile) { box.hidden = true; mobile.hidden = false; return; }
  mobile.hidden = true;
  box.hidden = false;
  if (OS === 'windows') {
    title.textContent = t('dl_title_windows');
    main.innerHTML = bigBtn('win-exe', 'btn_win', 'btn_win_sub', true) + bigBtn('win-zip', 'btn_win_zip', 'btn_win_zip_sub', false);
    extra.innerHTML = (ARCH === 'arm' ? '<p class="archnote">' + t('win_arm_note') + '</p>' : '') +
      '<p class="dl-note">' + t('dl_note_win') + '</p>';
  } else if (OS === 'mac') {
    // Both versions are always offered. When a Chromium browser reports the CPU, the matching one
    // becomes the primary button; otherwise (Safari, Firefox) Apple chip stays first.
    title.textContent = t('dl_title_mac');
    const intel = ARCH === 'x86';
    main.innerHTML = intel
      ? bigBtn('mac-intel', 'btn_mac_intel', 'btn_mac_intel_sub', true) + bigBtn('mac-arm', 'btn_mac_arm', 'btn_mac_arm_sub', false)
      : bigBtn('mac-arm', 'btn_mac_arm', 'btn_mac_arm_sub', true) + bigBtn('mac-intel', 'btn_mac_intel', 'btn_mac_intel_sub', false);
    const guess = ARCH === 'arm' ? '<p>' + t('mac_arch_arm') + '</p>' : intel ? '<p>' + t('mac_arch_intel') + '</p>' : '';
    extra.innerHTML = '<div class="which">' + guess + '<p>' + t('which_how') + '</p></div><p class="dl-note">' + t('dl_note_mac') + '</p>';
    // Same choice in the Mac install tab.
    const tabArm = document.getElementById('macTabArm');
    const tabIntel = document.getElementById('macTabIntel');
    tabArm.classList.toggle('primary', !intel);
    tabIntel.classList.toggle('primary', intel);
    if (intel) tabArm.parentNode.insertBefore(tabIntel, tabArm);
    else tabArm.parentNode.insertBefore(tabArm, tabIntel);
  } else if (OS === 'chromeos') {
    title.textContent = t('dl_title_chromeos');
    main.innerHTML = '';
    extra.innerHTML = '<p class="dl-note">' + t('dl_note_chromeos') + '</p>';
  } else if (OS === 'linux') {
    title.textContent = t('dl_title_linux');
    main.innerHTML = bigBtn('linux-appimage', 'btn_linux', 'btn_linux_sub', true) + bigBtn('linux-deb', 'btn_linux_deb', 'btn_linux_deb_sub', false);
    extra.innerHTML = '<p class="dl-note">' + t('dl_note_linux') + '</p>';
  } else {
    title.textContent = t('dl_title_other');
    main.innerHTML = '';
    extra.innerHTML = '<p class="dl-note">' + t('dl_note_other') + '</p>';
  }
}

/* ================= tabs ================= */
const tabs = Array.from(document.querySelectorAll('[data-os-tab]'));
function selectTab(os, focus) {
  tabs.forEach((b) => {
    const on = b.dataset.osTab === os;
    b.setAttribute('aria-selected', on ? 'true' : 'false');
    b.tabIndex = on ? 0 : -1;
    document.getElementById(b.getAttribute('aria-controls')).hidden = !on;
    if (on && focus) b.focus();
  });
}
tabs.forEach((b, i) => {
  b.addEventListener('click', () => selectTab(b.dataset.osTab, false));
  b.addEventListener('keydown', (e) => {
    let j = null;
    if (e.key === 'ArrowRight') j = (i + 1) % tabs.length;
    else if (e.key === 'ArrowLeft') j = (i - 1 + tabs.length) % tabs.length;
    else if (e.key === 'Home') j = 0;
    else if (e.key === 'End') j = tabs.length - 1;
    if (j !== null) { e.preventDefault(); selectTab(tabs[j].dataset.osTab, true); }
  });
});
selectTab(OS === 'mac' || OS === 'linux' ? OS : 'windows', false);

/* ================= apply language ================= */
function applyI18n() {
  document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
  document.title = t('doc_title');
  const md = document.querySelector('meta[name="description"]');
  if (md) md.setAttribute('content', t('doc_desc'));
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach((el) => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-aria]').forEach((el) => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  const lb = document.getElementById('langBtn');
  lb.textContent = t('lang_btn');
  lb.setAttribute('lang', lang === 'pt' ? 'en' : 'pt-BR');
  lb.setAttribute('aria-label', t('lang_btn_aria'));
  document.querySelector('.brand').setAttribute('aria-label', t('brand'));
  renderPrimary();
}

document.getElementById('langBtn').addEventListener('click', () => {
  lang = lang === 'pt' ? 'en' : 'pt';
  store.set(LANG_KEY, lang);
  document.getElementById('copyMsg').textContent = '';
  document.getElementById('shareMsg').textContent = '';
  applyI18n();
});

/* ================= share (phones) ================= */
document.getElementById('shareBtn').addEventListener('click', async () => {
  const msg = document.getElementById('shareMsg');
  const url = 'https://dosxnjos.github.io/lacre/';
  try {
    if (navigator.share) { await navigator.share({ title: t('doc_title'), url: url }); return; }
  } catch (e) {
    if (e && e.name === 'AbortError') return;
  }
  try {
    await navigator.clipboard.writeText(url);
    msg.textContent = t('m_copied');
  } catch (e) {
    msg.textContent = t('m_copy_fail');
  }
});

/* ================= copy the Terminal line (Mac) ================= */
document.getElementById('copyBtn').addEventListener('click', async () => {
  const code = document.getElementById('xattrCmd');
  const msg = document.getElementById('copyMsg');
  try {
    if (!navigator.clipboard || !navigator.clipboard.writeText) throw new Error('no clipboard');
    await navigator.clipboard.writeText(code.textContent.trim());
    msg.textContent = t('copy_ok');
  } catch (e) {
    try {
      const r = document.createRange();
      r.selectNodeContents(code);
      const s = window.getSelection();
      s.removeAllRanges();
      s.addRange(r);
    } catch (e2) {}
    msg.textContent = t('copy_fail');
  }
});

applyI18n();
detectArch();
})();
</script>
